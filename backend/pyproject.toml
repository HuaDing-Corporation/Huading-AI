[project]
name = "huading-backend"
version = "0.1.0"
description = "FastAPI backend for the Huading AI monorepo."
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.13.3",
  "boto3>=1.35.0",
  "celery>=5.4.0",
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "redis>=5.1.1",
  "sqlalchemy>=2.0.35",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.31.0",
  # ---- Video engine (distilled from Pixelle-Video, Streamlit removed) ----
  "loguru>=0.7.0",
  "pyyaml>=6.0.0",
  "openai>=2.6.0",
  "edge-tts==7.2.7",
  "ffmpeg-python>=0.2.0",
  "moviepy==1.0.3",
  "pillow>=10.0.0,<12",
  "comfykit>=0.1.12",
  "beautifulsoup4>=4.14.2",
  "playwright>=1.58.0",
  "dashscope>=1.23.0",
  "requests>=2.32.0",
  "pyjwt>=2.10.0",
  "numpy>=1.26.0",
  "certifi>=2025.10.5"
]

[dependency-groups]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0"
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored, minimally-modified upstream code (Pixelle-Video, Apache-2.0).
# Excluded from lint to keep it in sync with upstream and avoid churn; our own
# interface layer (engine/__init__.py, config.py, factory.py) is still linted.
extend-exclude = ["app/engine/pixelle_video"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
