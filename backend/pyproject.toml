[project]
name = "huading-backend"
version = "0.1.0"
description = "FastAPI backend for the Huading AI monorepo."
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.13.3",
  "boto3>=1.35.0",
  "celery>=5.4.0",
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "redis>=5.1.1",
  "sqlalchemy>=2.0.35",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.31.0"
]

[dependency-groups]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0"
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
