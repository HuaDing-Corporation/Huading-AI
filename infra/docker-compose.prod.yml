name: huading-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-huading}
      POSTGRES_USER: ${POSTGRES_USER:-huading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-huading} -d $${POSTGRES_DB:-huading}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      ENGINE_S3_BUCKET: ${ENGINE_S3_BUCKET:-huading-videos}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ENGINE_CORS_ORIGINS: ${ENGINE_CORS_ORIGINS:-https://huadingai.cn}
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -eu
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
      mc mb --ignore-existing local/"$$ENGINE_S3_BUCKET" &&
      mc anonymous set none local/"$$ENGINE_S3_BUCKET" &&
      cat > /tmp/bgm-cors.json <<EOF
      [
        {
          "AllowedOrigins": ["$$ENGINE_CORS_ORIGINS"],
          "AllowedMethods": ["GET", "HEAD"],
          "AllowedHeaders": ["*"],
          "ExposeHeaders": ["ETag", "Content-Length", "Content-Type"],
          "MaxAgeSeconds": 3600
        }
      ]
      EOF
      mc cors set local/"$$ENGINE_S3_BUCKET" /tmp/bgm-cors.json

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_INDEX: ${UV_INDEX:-}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    restart: always
    env_file: ${HUADING_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-huading}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-huading}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ENGINE_CORS_ORIGINS: https://huadingai.cn
      STORAGE_BACKEND: s3
      ENGINE_S3_ENDPOINT: http://minio:9000
      ENGINE_S3_PUBLIC_ENDPOINT: https://huadingai.cn
      ENGINE_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      ENGINE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ENGINE_S3_BUCKET: ${ENGINE_S3_BUCKET:-huading-videos}
      ENGINE_S3_REGION: ${ENGINE_S3_REGION:-us-east-1}
      ENGINE_S3_SECURE: "false"
      ENGINE_S3_ADDRESSING_STYLE: path
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - backend-media:/app/.local-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/openapi.json"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_INDEX: ${UV_INDEX:-}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    restart: always
    env_file: ${HUADING_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-huading}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-huading}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_BACKEND: s3
      ENGINE_S3_ENDPOINT: http://minio:9000
      ENGINE_S3_PUBLIC_ENDPOINT: https://huadingai.cn
      ENGINE_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      ENGINE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ENGINE_S3_BUCKET: ${ENGINE_S3_BUCKET:-huading-videos}
      ENGINE_S3_REGION: ${ENGINE_S3_REGION:-us-east-1}
      ENGINE_S3_SECURE: "false"
      ENGINE_S3_ADDRESSING_STYLE: path
    command: celery -A app.workers.celery_app.celery_app worker --pool=solo --concurrency=1 -Q default,avatar,image --loglevel=info
    volumes:
      - backend-media:/app/.local-storage
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  worker-video:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_INDEX: ${UV_INDEX:-}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    restart: always
    env_file: ${HUADING_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-huading}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-huading}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_BACKEND: s3
      ENGINE_S3_ENDPOINT: http://minio:9000
      ENGINE_S3_PUBLIC_ENDPOINT: https://huadingai.cn
      ENGINE_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      ENGINE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ENGINE_S3_BUCKET: ${ENGINE_S3_BUCKET:-huading-videos}
      ENGINE_S3_REGION: ${ENGINE_S3_REGION:-us-east-1}
      ENGINE_S3_SECURE: "false"
      ENGINE_S3_ADDRESSING_STYLE: path
    command: celery -A app.workers.celery_app.celery_app worker --concurrency=3 -Q video --loglevel=info
    volumes:
      - backend-media:/app/.local-storage
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://huadingai.cn/api
        NEXT_PUBLIC_USE_MOCK: "0"
    restart: always
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/docker-entrypoint.d:/docker-entrypoint.d:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      minio:
        condition: service_healthy

  certbot:
    image: certbot/certbot:v2.11.0
    restart: always
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  backend-media:
  certbot-etc:
  certbot-www:
