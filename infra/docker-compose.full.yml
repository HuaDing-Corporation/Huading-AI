# Full-stack one-command e2e: postgres + redis + backend API + celery worker + frontend.
# Storage defaults to local MinIO. For real OmniHuman e2e, set ENGINE_S3_* in
# infra/.env to a public Volcengine TOS endpoint so Jimeng can fetch presigned
# avatar/audio URLs.
#
#   cd infra
#   cp .env.example .env        # then fill ENGINE_LLM_* (and JWT_SECRET_KEY)
#   docker compose -f docker-compose.full.yml up --build
#
# Open http://localhost:3000 -> register tenant -> login -> 新建视频 -> watch
# progress -> 成片. See README for the full walkthrough.
name: huading-full

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: huading
      POSTGRES_USER: huading
      POSTGRES_PASSWORD: huading
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huading -d huading"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-huading}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-to-a-32+char-random-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      ENGINE_S3_BUCKET: ${ENGINE_S3_BUCKET:-huading-videos}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-huading}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-to-a-32+char-random-minio-secret}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$ENGINE_S3_BUCKET &&
      mc anonymous set none local/$$ENGINE_S3_BUCKET
      "

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        # Optional package mirrors for restricted networks (empty = upstream).
        APT_MIRROR: ${APT_MIRROR:-}
        UV_INDEX: ${UV_INDEX:-}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    env_file: .env
    environment:
      # Point services at each other by compose service name (override .env's
      # localhost defaults).
      DATABASE_URL: postgresql+psycopg://huading:huading@postgres:5432/huading
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      STORAGE_BACKEND: s3
      ENGINE_S3_ENDPOINT: ${ENGINE_S3_ENDPOINT:-http://minio:9000}
      ENGINE_S3_PUBLIC_ENDPOINT: ${ENGINE_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      ENGINE_S3_ACCESS_KEY: ${ENGINE_S3_ACCESS_KEY:-huading}
      ENGINE_S3_SECRET_KEY: ${ENGINE_S3_SECRET_KEY:-change-me-to-a-32+char-random-minio-secret}
      ENGINE_S3_BUCKET: ${ENGINE_S3_BUCKET:-huading-videos}
      ENGINE_S3_REGION: ${ENGINE_S3_REGION:-us-east-1}
      ENGINE_S3_SECURE: ${ENGINE_S3_SECURE:-false}
    # Run DB migrations, then serve the API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      # Host port is configurable via BACKEND_PORT (default 8000). If you change
      # it, also set NEXT_PUBLIC_API_BASE_URL to match (the browser uses it).
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - media:/app/.local-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/openapi.json"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        # Optional package mirrors for restricted networks (empty = upstream).
        APT_MIRROR: ${APT_MIRROR:-}
        UV_INDEX: ${UV_INDEX:-}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://huading:huading@postgres:5432/huading
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_BACKEND: s3
      ENGINE_S3_ENDPOINT: ${ENGINE_S3_ENDPOINT:-http://minio:9000}
      ENGINE_S3_PUBLIC_ENDPOINT: ${ENGINE_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      ENGINE_S3_ACCESS_KEY: ${ENGINE_S3_ACCESS_KEY:-huading}
      ENGINE_S3_SECRET_KEY: ${ENGINE_S3_SECRET_KEY:-change-me-to-a-32+char-random-minio-secret}
      ENGINE_S3_BUCKET: ${ENGINE_S3_BUCKET:-huading-videos}
      ENGINE_S3_REGION: ${ENGINE_S3_REGION:-us-east-1}
      ENGINE_S3_SECURE: ${ENGINE_S3_SECURE:-false}
    # Single-config / single-process worker (engine config is a process singleton).
    # It consumes default tasks plus avatar_talk/OmniHuman jobs routed to avatar;
    # production can split avatar into a dedicated worker if backlog isolation is needed.
    command: celery -A app.workers.celery_app.celery_app worker --pool=solo --concurrency=1 -Q default,avatar --loglevel=info
    volumes:
      - media:/app/.local-storage
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # Browser-side base URL; reaches the backend via the published host port.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  media:
  minio-data:
