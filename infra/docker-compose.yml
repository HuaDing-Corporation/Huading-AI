services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: huading
      POSTGRES_USER: huading
      POSTGRES_PASSWORD: huading
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huading -d huading"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-huading}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-to-a-32+char-random-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      ENGINE_S3_BUCKET: ${ENGINE_S3_BUCKET:-huading-videos}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-huading}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-to-a-32+char-random-minio-secret}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$ENGINE_S3_BUCKET &&
      mc anonymous set none local/$$ENGINE_S3_BUCKET
      "

volumes:
  postgres-data:
  minio-data:
