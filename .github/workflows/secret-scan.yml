name: Secret scan

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      # gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for org-owned repos.
      # We run the open-source CLI directly instead, which has no such gate.
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so a leak in any scanned commit is caught.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        # Exit code 1 (leaks found) fails the job. --redact keeps secrets out of logs.
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
