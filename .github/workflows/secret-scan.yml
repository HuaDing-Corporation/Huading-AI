name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so a leak in any scanned commit range is caught.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Fail the job when any secret is found (this is the default; set
          # explicitly for clarity).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
