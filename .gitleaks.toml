# gitleaks configuration for the Huading AI monorepo.
# Docs: https://github.com/gitleaks/gitleaks#configuration
#
# We extend the bundled default ruleset and add a rule for `sk-` style API keys,
# because several providers we use (DashScope, DeepSeek, Moonshot, ...) issue keys
# like `sk-<hex>` that are SHORTER than the 48-char OpenAI key the default rule
# expects — so the default config alone would NOT have caught the hard-coded
# DashScope key removed in commit 3bbe278.

title = "Huading gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "huading-sk-api-key"
description = "Generic sk- style provider API key (OpenAI/DashScope/DeepSeek/Moonshot/etc.)"
# `sk-` (optionally `sk-proj-`/`sk-ant-` style) followed by 16+ key chars.
regex = '''sk-(?:proj-|ant-|or-)?[A-Za-z0-9_\-]{16,}'''
keywords = ["sk-"]

[allowlist]
description = "Historical removed key + lockfile integrity/hash shapes (not secrets)."
# Allowlist by VALUE/SHAPE only — NOT by file path. The previous config
# wholesale-allowlisted entire lockfile paths, which would have hidden a real
# token sneaked into a lockfile. Here we only ignore integrity/hash-shaped
# strings, so a real credential in a lockfile is still reported.
regexes = [
  # Known historical leak: committed before the repo was public, removed in
  # 3bbe278, rotated/revoked. Kept so full-history scans of OLD commits pass.
  '''sk-bcab316d69a7414faa9dc29737019333''',
  # npm/yarn/pnpm Subresource Integrity: sha1-/sha256-/sha384-/sha512-<base64>.
  '''sha(?:1|256|384|512)-[A-Za-z0-9+/=_-]{16,}''',
  # uv.lock / Python package hashes: sha256:<hex>.
  '''sha256:[a-f0-9]{64}''',
]
